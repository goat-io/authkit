name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: authkit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authkit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTHKIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/authkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Check module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Compile README example
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text()
          example = readme.split("```go\n", 1)[1].split("\n```", 1)[0]
          Path("/tmp/authkit-readme-main.go").write_text(example + "\n")
          PY
          go build -o /tmp/authkit-readme-example /tmp/authkit-readme-main.go
      - name: Test with race detector
        run: go test -race -count=1 ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
